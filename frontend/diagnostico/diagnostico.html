<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diagnóstico inicial</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/diagnostico.css">
    <link rel="stylesheet" href="/accesibilidad.css">
</head>

<body>
    <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido principal</a>
    <div id="app-header"></div>

    <main class="main-content" id="contenido-principal" tabindex="-1">
        <div class="reading-card">
            <div class="reading-hero">
                <div class="reading-emoji">🧠</div>
                <div>
                    <h2>Diagnóstico inicial de comprensión lectora</h2>
                    <p>Dos lecturas para conocer tu punto de partida.</p>
                </div>
            </div>

            <div class="reading-body">
                <p id="diagnostic-instructions" class="diagnostic-info">Cargando las lecturas…</p>
                <div id="diagnostic-readings"></div>
                <p id="diagnostic-status" role="status" aria-live="polite"></p>
                <button id="submit-diagnostic" type="button" disabled>✅ Finalizar diagnóstico</button>
            </div>
        </div>
    </main>

    <script src="header.js"></script>
    <script src="diagnostico.js"></script>
</body>

</html>
