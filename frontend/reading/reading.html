<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tutor Inteligente - Lectura</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/reading.css">
</head>

<body>
<div id="app-header"></div>

<main class="main-content reading-grid">
    <div class="reading-column">
        <button id="back-btn" class="back-button">← Volver al dashboard</button>

        <div class="reading-card">
            <div class="reading-hero">
                <div class="reading-emoji">📖</div>
                <div>
                    <h2 id="text-title"></h2>
                </div>
            </div>
            <div id="text-body" class="reading-body"></div>
        </div>
    </div>

    <aside class="questions-panel">
        <div class="questions-sidebar-card">
            <h3>Preguntas de comprensión</h3>
            <div id="questions-list"></div>
            <button id="submit-answers">Enviar respuestas</button>
        </div>
    </aside>
</main>

<!-- Modal de resumen de sesión -->
<div id="summary-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🎉 ¡Sesión Completada!</h2>
        </div>
        <div class="modal-body">
            <div class="session-summary">
                <div class="summary-stat">
                    <p class="stat-label">Preguntas Respondidas</p>
                    <p class="stat-value" id="summary-answered">0</p>
                </div>
                <div class="summary-stat">
                    <p class="stat-label">Respuestas Correctas</p>
                    <p class="stat-value" id="summary-correct">0</p>
                </div>
                <div class="summary-stat">
                    <p class="stat-label">Porcentaje</p>
                    <p class="stat-value" id="summary-percentage">0%</p>
                </div>
            </div>
            <div id="recommendation-box" class="recommendation-box" style="display: none;">
                <p id="recommendation-text"></p>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btn-retry-reading" class="btn-secondary">Volver a intentar</button>
            <button id="btn-continue-dashboard" class="btn-primary">Volver al Dashboard</button>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script src="reading.js"></script>

</body>
</html>
