<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tutor Inteligente - Login</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/login.css">
</head>

<body>

<div class="login-container">
    <div class="login-wrapper">
        <div class="login-header">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    <line x1="6" y1="8" x2="6" y2="8"/>
                    <line x1="8" y1="12" x2="8" y2="12"/>
                    <line x1="10" y1="8" x2="10" y1="8"/>
                    <line x1="12" y1="12" x2="12" y1="12"/>
                    <line x1="14" y1="8" x2="14" y1="8"/>
                </svg>
            </div>
            <h1>Tutor Inteligente</h1>
            <p>Aprende a leer mejor, paso a paso 📚</p>
        </div>

        <div class="login-card">
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="icon input-icon">✉️</span>
                        <input type="email" id="email" placeholder="estudiante@escuela.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="icon lock-icon">🔒</span>
                        <input type="password" id="password" placeholder="Contraseña" required>
                        <span class="icon eye-icon" onclick="togglePassword()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </span>
                    </div>
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>
        </div>

        <p class="demo-note">EducaColegio · ingresa tu correo y contraseña</p>
    </div>
</div>

<script src="login.js"></script>

</body>
</html>
